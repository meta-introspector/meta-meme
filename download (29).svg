<g transform="translate(855 175)">
 <text fill="#b69cff" class="label" font-size="16">32-DIMENSIONAL MODEL</text>
 <text y="43" class="math white" font-size="19">qₙ(θ,u) = (cos(π+θ),</text><text y="70" class="math white" font-size="19">sin(π+θ)u)</text>
 <text y="98" class="muted" font-size="14">where u ∈ ℝ31 and ‖u‖ = 1</text>
 <line y1="125" x2="300" y2="125" stroke="#aec4e3" stroke-opacity=".2"/>
 <text y="164" fill="#5ce1e6" class="label" font-size="15">TRANSLATION</text>
 <text y="202" class="math white" font-size="21">rₙ(θ,u) = qₙ(θ,u) + e₀</text>
 <text y="236" fill="#ffd166" font-size="14">Gold: projected qₙ</text><text y="261" fill="#5ce1e6" font-size="14">Cyan: add e₀ tip-to-tail</text><text y="286" fill="#ff70ae" font-size="14">Pink arrow: current residual rₙ</text>
 <text y="311" fill="#b69cff" font-size="14">Dashes: path it will take</text>
 <text y="336" fill="#ff70ae" font-size="14">Solid trace: path it did take</text>
 <rect y="363" width="300" height="151" rx="17" fill="#071426" stroke="#61f4c2" stroke-opacity=".32"/>
 <text x="18" y="397" fill="#61f4c2" class="label" font-size="15">EXACT CANCELLATION</text>
 <text x="18" y="434" class="math white" font-size="20">qₙ(0,u) + e₀ = 0</text>
 <text x="18" y="464" class="muted" font-size="14">for every direction u</text>
 <text x="18" y="493" class="math" fill="#61f4c2" font-size="17">θ = 2πk gives zero</text>
 <text y="550" class="muted" font-size="13">Visible labels: first 8 axes; 24 fainter axes continue the fan.</text>
 </g>
<text x="48" y="744" class="muted" font-size="13">This is a real-coordinate generalization, not a claim that every ℝ32 has complex or quaternion multiplication. The map ℝ32 → ℝ² changes appearance, never the coordinate identity.</text>
