<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Euler phase coordinate analogue in 12 dimensions</title>
<desc id="desc">A script-free animation of a phase vector in R to the 12, translated by the first basis vector. The residual returns to zero at each full turn.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040918"/><stop offset=".58" stop-color="#11213e"/><stop offset="1" stop-color="#27123d"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#b69cff" stop-opacity=".25"/><stop offset="1" stop-color="#b69cff" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker>
 <style>text{font-family:Inter,system-ui,sans-serif}.math{font-family:Georgia,serif}.muted{fill:#9eb2cd}.white{fill:#f6f8ff}.label{font-weight:750;letter-spacing:1.4px}</style>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/><circle cx="430" cy="405" r="310" fill="url(#halo)"/>
<text x="48" y="48" fill="#b69cff" class="label" font-size="16">EULER PHASE • 12D • AUTOPLAY</text>
<text x="48" y="91" class="white" font-size="31" font-weight="760">A coordinate phase in ℝ12 and its 2D projection</text>
<text x="48" y="122" class="muted" font-size="16">One real coordinate + 11 imaginary-direction coordinates; projection is illustrative, cancellation is exact.</text>
