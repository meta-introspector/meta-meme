<circle cx="575" cy="565" r="6" fill="#f5f8ff"/><text x="587" y="590" class="white" font-size="16">0</text>
<g transform="translate(1180 245)">
 <text class="violet label">4D PHASOR</text>
 <text y="43" class="math white" font-size="20">ℍ = spanℝ{1, i, j, k}</text>
 <text y="77" class="math gold" font-size="19">Q = cos(π+θ) + u sin(π+θ)</text>
 <text y="108" class="muted" font-size="15">Gold: origin → quaternion phase</text>
 <line y1="135" x2="325" y2="135" stroke="#9db4d2" stroke-opacity=".22"/>
 <text y="178" class="cyan label">VECTOR ADDITION</text>
 <text y="218" class="math white" font-size="22">R₄(θ) = Q(θ) + 1</text>
 <text y="251" class="cyan" font-size="16">Cyan: translate Q by +1</text>
 <text y="280" class="pink" font-size="16">Pink: resultant from 0</text>
 <rect y="319" width="325" height="177" rx="18" fill="#071426" fill-opacity=".7" stroke="#61f4c2" stroke-opacity=".3"/>
 <text x="20" y="354" class="green" font-size="17" font-weight="750">4D EULER IDENTITY</text>
 <text x="20" y="393" class="math white" font-size="23">exp(πu) + 1 = 0</text>
 <text x="20" y="426" class="muted" font-size="15">for every unit imaginary u</text>
 <text x="20" y="459" class="math green" font-size="18">R₄(θ)=0 ⇔ θ=2πn</text>
 <text x="20" y="482" class="muted" font-size="14">along this phase sweep</text>
 <text y="545" class="gold label">COMPLEX SLICE</text>
 <text y="583" class="math white" font-size="19">Choose u = i:</text>
 <text y="617" class="math white" font-size="19">e<tspan baseline-shift="super" font-size="12">iπ</tspan> + 1 = −1 + 1 = 0</text>
 <text y="651" class="muted" font-size="15">The 2D identity is a plane inside 4D.</text>
</g>
<text x="70" y="957" class="muted" font-size="14">Projection pipeline: quaternion coordinates (Re, i, j, k) → oblique 3D shadow → 2D screen. Projection changes appearance, not the zero-cancellation equation.</text>
</svg>