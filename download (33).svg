<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Euler's identity as a four-dimensional quaternion phase</title>
<desc id="desc">An autoplaying four-dimensional Euler phase is projected to the screen. A quaternion phasor, the translated plus-one vector, and their residual meet at zero whenever theta is a full turn.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040918"/><stop offset=".55" stop-color="#101b38"/><stop offset="1" stop-color="#25103c"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2945" stop-opacity=".94"/><stop offset="1" stop-color="#291747" stop-opacity=".94"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#b69cff" stop-opacity=".32"/><stop offset="1" stop-color="#b69cff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bdd1ed" stroke-opacity=".05"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#00040e" flood-opacity=".58"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.math{font-family:Georgia,"Times New Roman",serif}.white{fill:#f5f8ff}.muted{fill:#9eb2cd}.cyan{fill:#5ce1e6}.gold{fill:#ffd166}.violet{fill:#b69cff}.pink{fill:#ff70ae}.green{fill:#61f4c2}.label{font-size:17px;font-weight:760;letter-spacing:1.6px}.card{fill:#09182e;fill-opacity:.84;stroke:#aec7e8;stroke-opacity:.17;stroke-width:1.5}</style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
<circle cx="180" cy="80" r="280" fill="#168da8" opacity=".065"/><circle cx="1450" cy="900" r="380" fill="#a03fda" opacity=".07"/>
<text x="70" y="65" class="violet label">EULER PHASE • 4D • ANIMATED</text>
<text x="70" y="118" class="white" font-size="43" font-weight="760">Euler’s identity inside four-dimensional quaternion space</text>
<text x="70" y="157" class="muted" font-size="20">The familiar complex circle is lifted into ℍ ≅ ℝ⁴, then projected here as a changing 3D shadow.</text>
