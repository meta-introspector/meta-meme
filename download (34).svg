<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Euler phase cancellation, residual rotation, and an illustrative 23-layer golden-ratio recursion</title>
  <desc id="desc">A complex-plane diagram shows a unit vector at phase theta, its negation after a pi rotation, and the residual one minus exp i theta. Supporting panels show the exact cancellation criterion, a 23-layer golden-ratio recurrence, and the distinction from Penrose twistor theory.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#10213d"/>
      <stop offset="1" stop-color="#180f30"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132b49" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#211946" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
    <radialGradient id="zeroGlow">
      <stop offset="0" stop-color="#62f5c3" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#62f5c3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9eb4d1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#5ce1e6"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#ff6fae"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#ffd166"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .muted { fill: #aabbd2; }
      .white { fill: #f5f8ff; }
      .cyan { fill: #5ce1e6; }
      .pink { fill: #ff6fae; }
      .goldText { fill: #ffd166; }
      .green { fill: #62f5c3; }
      .card { fill: #10213a; fill-opacity: 0.87; stroke: #8ea6cb; stroke-opacity: 0.18; stroke-width: 1.5; }
      .label { font-size: 18px; font-weight: 650; letter-spacing: 0.4px; }
      .small { font-size: 15px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="150" cy="80" r="240" fill="#1a7f9c" opacity="0.08"/>
  <circle cx="1480" cy="920" r="330" fill="#9d4edd" opacity="0.08"/>

  <!-- Header -->
  <g class="sans">
    <text x="80" y="72" class="white" font-size="18" font-weight="700" letter-spacing="3.2">EULER PHASE • COMPLEX ROTATION • RECURSION</text>
    <text x="80" y="125" class="white" font-size="44" font-weight="760">When does the rotated phase cancel?</text>
    <text x="80" y="163" class="muted" font-size="20">A geometric reading of e<tspan baseline-shift="super" font-size="14">i(π+θ)</tspan> + 1 — and what a 23-layer golden-ratio operator would still need to prove.</text>
  </g>

  <!-- Main cards -->
  <rect x="60" y="200" width="970" height="570" rx="26" fill="url(#hero)" stroke="#aac4ea" stroke-opacity="0.2" filter="url(#shadow)"/>
  <rect x="1060" y="200" width="480" height="570" rx="26" class="card" filter="url(#shadow)"/>

  <!-- Equation ribbon -->
  <g class="serif">
    <rect x="92" y="225" width="906" height="82" rx="16" fill="#071426" fill-opacity="0.6" stroke="#5ce1e6" stroke-opacity="0.18"/>
    <text x="545" y="276" text-anchor="middle" class="white" font-size="27">
      e<tspan baseline-shift="super" font-size="18">i(π+θ)</tspan> + 1
      <tspan class="muted"> = </tspan>−(cos θ + i sin θ) + 1
      <tspan class="muted"> = </tspan>1 − e<tspan baseline-shift="super" font-size="18">iθ</tspan>
    </text>
  </g>

  <!-- Complex plane -->
  <g>
    <!-- plot backing -->
    <rect x="92" y="330" width="580" height="405" rx="18" fill="#071426" fill-opacity="0.38"/>
    <!-- glow at cancellation endpoint 1 -->
    <circle cx="555" cy="532" r="55" fill="url(#zeroGlow)"/>
    <!-- axes -->
    <line x1="125" y1="532" x2="638" y2="532" stroke="#b9c8dd" stroke-opacity="0.58" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <line x1="365" y1="706" x2="365" y2="355" stroke="#b9c8dd" stroke-opacity="0.58" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="624" y="557" class="sans muted small">Re</text>
    <text x="379" y="372" class="sans muted small">Im</text>
    <!-- unit circle -->
    <circle cx="365" cy="532" r="190" fill="none" stroke="#91a7c4" stroke-opacity="0.27" stroke-width="2" stroke-dasharray="7 8"/>
    <!-- ticks -->
    <g stroke="#91a7c4" stroke-opacity="0.45" stroke-width="1.4">
      <line x1="555" y1="525" x2="555" y2="539"/><line x1="175" y1="525" x2="175" y2="539"/>
      <line x1="358" y1="342" x2="372" y2="342"/><line x1="358" y1="722" x2="372" y2="722"/>
    </g>
    <g class="sans muted" font-size="14">
      <text x="550" y="557">1</text><text x="165" y="557">−1</text>
      <text x="378" y="348">i</text><text x="378" y="719">−i</text>
    </g>
    <!-- angle theta arc; example theta about 35 degrees -->
    <path d="M425 532 A60 60 0 0 0 414 498" fill="none" stroke="#ffd166" stroke-width="3" marker-end="url(#arrowGold)"/>
    <text x="431" y="505" class="serif goldText" font-size="22" font-style="italic">θ</text>
    <!-- e i theta vector to P=(521,423) -->
    <line x1="365" y1="532" x2="520.6" y2="423" stroke="#ffd166" stroke-width="4" marker-end="url(#arrowGold)"/>
    <circle cx="520.6" cy="423" r="6" fill="#ffd166"/>
    <text x="530" y="412" class="serif goldText" font-size="20">e<tspan baseline-shift="super" font-size="13">iθ</tspan></text>
    <!-- negative vector from origin: -e i theta = (209,641) -->
    <line x1="365" y1="532" x2="209.4" y2="641" stroke="#ff6fae" stroke-width="4" marker-end="url(#arrowPink)"/>
    <circle cx="209.4" cy="641" r="6" fill="#ff6fae"/>
    <text x="130" y="674" class="serif pink" font-size="19">−e<tspan baseline-shift="super" font-size="12">iθ</tspan> = e<tspan baseline-shift="super" font-size="12">i(π+θ)</tspan></text>
    <!-- +1 translated vector starts negative endpoint and ends residual -->
    <line x1="209.4" y1="641" x2="399.4" y2="641" stroke="#5ce1e6" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <text x="293" y="628" class="serif cyan" font-size="19">+1</text>
    <!-- residual from origin -->
    <line x1="365" y1="532" x2="399.4" y2="641" stroke="#62f5c3" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <circle cx="399.4" cy="641" r="7" fill="#62f5c3"/>
    <text x="414" y="659" class="serif green" font-size="18">R(θ) = 1 − e<tspan baseline-shift="super" font-size="12">iθ</tspan></text>
    <!-- guide showing translated -e vector equivalent -->
    <line x1="520.6" y1="423" x2="555" y2="532" stroke="#62f5c3" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 6"/>
    <line x1="555" y1="532" x2="399.4" y2="641" stroke="#ff6fae" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="5 6"/>
    <!-- origin -->
    <circle cx="365" cy="532" r="5" fill="#f5f8ff"/>
  </g>

  <!-- Main explanation beside plot -->
  <g class="sans">
    <text x="710" y="355" class="cyan label">GEOMETRIC STORY</text>
    <g font-size="18">
      <circle cx="722" cy="398" r="14" fill="#ffd166"/><text x="722" y="404" text-anchor="middle" fill="#071426" font-weight="800">1</text>
      <text x="752" y="404" class="white">Start at e<tspan baseline-shift="super" font-size="12">iθ</tspan> on the unit circle.</text>
      <circle cx="722" cy="450" r="14" fill="#ff6fae"/><text x="722" y="456" text-anchor="middle" fill="#071426" font-weight="800">2</text>
      <text x="752" y="456" class="white">Rotate by π: multiply by −1.</text>
      <circle cx="722" cy="502" r="14" fill="#5ce1e6"/><text x="722" y="508" text-anchor="middle" fill="#071426" font-weight="800">3</text>
      <text x="752" y="508" class="white">Add 1 along the real axis.</text>
    </g>
    <rect x="700" y="545" width="294" height="159" rx="16" fill="#071426" fill-opacity="0.56" stroke="#62f5c3" stroke-opacity="0.28"/>
    <text x="720" y="578" class="green label">RESIDUAL SIZE</text>
    <text x="847" y="626" text-anchor="middle" class="serif white" font-size="25">|R(θ)| = 2 |sin(θ/2)|</text>
    <line x1="722" y1="648" x2="972" y2="648" stroke="#91a7c4" stroke-opacity="0.28"/>
    <text x="847" y="678" text-anchor="middle" class="muted" font-size="16">Detuning leaves a chord, not zero.</text>
  </g>

  <!-- Right card: exact criterion -->
  <g class="sans">
    <text x="1092" y="245" class="green label">EXACT CANCELLATION</text>
    <text x="1300" y="302" text-anchor="middle" class="serif white" font-size="28">R(θ) = 0</text>
    <text x="1300" y="342" text-anchor="middle" class="serif cyan" font-size="25">⇔ θ = 2πn,  n ∈ ℤ</text>
    <rect x="1090" y="368" width="420" height="95" rx="15" fill="#0a192d"/>
    <circle cx="1125" cy="415" r="16" fill="#62f5c3" opacity="0.9"/>
    <path d="M1118 415l5 5 10-12" fill="none" stroke="#071426" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1155" y="405" class="white" font-size="17" font-weight="650">θ = 0 is the displayed case.</text>
    <text x="1155" y="433" class="muted" font-size="15">Globally, every full turn also cancels.</text>

    <text x="1092" y="510" class="goldText label">ILLUSTRATIVE Φ-RECURSION</text>
    <text x="1092" y="541" class="muted" font-size="15">Golden ratio ϕ = (1 + √5) / 2</text>

    <!-- recursion nodes -->
    <g>
      <path d="M1120 603 C1180 559,1238 559,1297 603 S1414 647,1475 603" fill="none" stroke="#ffd166" stroke-opacity="0.24" stroke-width="14"/>
      <path d="M1120 603 C1180 559,1238 559,1297 603 S1414 647,1475 603" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrowGold)"/>
      <circle cx="1120" cy="603" r="25" fill="#152943" stroke="#ffd166" stroke-width="2"/>
      <circle cx="1205" cy="578" r="25" fill="#152943" stroke="#ffd166" stroke-width="2"/>
      <circle cx="1297" cy="603" r="25" fill="#152943" stroke="#ffd166" stroke-width="2"/>
      <circle cx="1388" cy="628" r="25" fill="#152943" stroke="#ffd166" stroke-width="2"/>
      <circle cx="1475" cy="603" r="28" fill="#ffd166"/>
      <g text-anchor="middle" font-size="15" font-weight="750">
        <text x="1120" y="608" class="white">G₀</text><text x="1205" y="583" class="white">G₁</text>
        <text x="1297" y="608" class="white">G₂</text><text x="1388" y="633" class="white">…</text>
        <text x="1475" y="608" fill="#071426">G₂₃</text>
      </g>
    </g>
    <text x="1300" y="683" text-anchor="middle" class="serif white" font-size="22">G₀ = 0,   G<tspan baseline-shift="sub" font-size="14">k+1</tspan> = ϕG<tspan baseline-shift="sub" font-size="14">k</tspan> + 1</text>
    <text x="1300" y="720" text-anchor="middle" class="serif goldText" font-size="20">G₂₃ = ∑<tspan baseline-shift="sub" font-size="13">k=0</tspan><tspan baseline-shift="super" font-size="13">22</tspan> ϕ<tspan baseline-shift="super" font-size="13">k</tspan></text>
    <text x="1300" y="748" text-anchor="middle" class="muted" font-size="14">A precise candidate—not uniquely implied by “EFMW”.</text>
  </g>

  <!-- Bottom synthesis strip -->
  <rect x="60" y="800" width="1480" height="145" rx="24" class="card" filter="url(#shadow)"/>
  <g class="sans">
    <text x="92" y="838" class="white label">WHAT MUST BE CONNECTED — NOT MERELY ASSOCIATED</text>

    <!-- three concept pills and arrows -->
    <rect x="92" y="862" width="350" height="55" rx="27" fill="#17304d" stroke="#5ce1e6" stroke-opacity="0.55"/>
    <text x="267" y="895" text-anchor="middle" class="cyan" font-size="17" font-weight="700">Complex phase  θ</text>

    <line x1="451" y1="889" x2="516" y2="889" stroke="#aabbd2" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowCyan)"/>
    <text x="483" y="873" text-anchor="middle" class="muted" font-size="12">define a map</text>

    <rect x="528" y="862" width="420" height="55" rx="27" fill="#2c2743" stroke="#ffd166" stroke-opacity="0.55"/>
    <text x="738" y="895" text-anchor="middle" class="goldText" font-size="17" font-weight="700">Recursive state  G₂₃</text>

    <line x1="957" y1="889" x2="1022" y2="889" stroke="#aabbd2" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrowPink)"/>
    <text x="989" y="873" text-anchor="middle" class="muted" font-size="12">prove structure</text>

    <rect x="1034" y="862" width="474" height="55" rx="27" fill="#2b1e3d" stroke="#ff6fae" stroke-opacity="0.55"/>
    <text x="1271" y="895" text-anchor="middle" class="pink" font-size="17" font-weight="700">Twistor data  Z<tspan baseline-shift="super" font-size="11">α</tspan> = (ω<tspan baseline-shift="super" font-size="11">A</tspan>, π<tspan baseline-shift="sub" font-size="11">A′</tspan>)</text>
  </g>

  <!-- Footer -->
  <g class="sans">
    <text x="80" y="977" class="muted" font-size="13">Solid equations: standard complex analysis.  Golden recursion: an explicit illustrative model.  Twistor relation: requires independent definitions and proofs.</text>
    <text x="1520" y="977" text-anchor="end" fill="#7188a8" font-size="12">VECTOR DIAGRAM • SVG</text>
  </g>
</svg>
