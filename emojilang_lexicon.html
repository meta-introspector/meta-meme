h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
*{box-sizing:border-box}
body{margin:0;font-size:14px;color:var(--color-text-primary)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pill{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:12px;color:var(--color-text-secondary);transition:all .15s}
.pill.active{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}

.emoji-glyph{font-size:28px;line-height:1;display:block;margin-bottom:6px}
.card-label{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:2px}
.card-cat{font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.card-defs{font-size:12px;color:var(--color-text-secondary);line-height:1.4}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:10px;margin-top:4px}

.count{font-size:12px;color:var(--color-text-tertiary);margin-bottom:10px}
</style>

let active="All";
function cats(){
  const all=["All","Prime","Muse","Operator","API"];
  document.getElementById("cats").innerHTML=all.map(c=>
    `<span class="pill${c===active?' active':''}" onclick="setcat('${c}')">${c}</span>`
  ).join("");
}
function setcat(c){active=c;render()}
function render(){
  const q=(document.getElementById("q").value||"").toLowerCase();
  const filtered=entries.filter(e=>{
    const match=!q||(e.g+e.label+e.defs.join(" ")).toLowerCase().includes(q);
    const catmatch=active==="All"||e.cat===active;
    return match&&catmatch;
  });
  document.getElementById("cnt").textContent=`${filtered.length} entries`;
  document.getElementById("grid").innerHTML=filtered.map(e=>`
    <div class="card" onclick="sendPrompt('Tell me more about the emojilang entry for ${e.g} (${e.label})')">
      <span class="emoji-glyph">${e.g}</span>
      <div class="card-cat">${e.cat}${e.prime?' · prime '+e.prime:''}</div>
      <div class="card-label">${e.label}</div>
      <div class="card-defs">${e.defs.slice(0,3).join(" · ")}</div>
      <span class="badge ${e.badge}">${e.cat}</span>
    </div>`).join("");
}
cats();render();
